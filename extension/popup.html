<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>ACP WebBridge</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <h3>ACP WebBridge</h3>
    <label class="switch">
      <input type="checkbox" id="enabled-toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-bar">
    <span>الحالة:</span>
    <strong id="status-text">غير متصل</strong>
  </div>

  <div class="field">
    <label for="token-input">رمز الوصول (Token):</label>
    <div class="input-row">
      <input type="password" id="token-input" placeholder="ألصق الرمز هنا...">
      <button id="save-token-btn">حفظ</button>
    </div>
  </div>

  <div class="field">
    <label for="port-input">منفذ الموزع (Port):</label>
    <input type="number" id="port-input" value="9334">
  </div>

  <div class="handover-section">
    <h4>تسليم التبويب الحالي:</h4>
    <div id="handover-info">لا يوجد تبويب مُسلّم حالياً</div>
    <div class="btn-group">
      <button id="handover-btn" class="primary-btn">استخدم هذا التبويب</button>
      <button id="revoke-btn" class="secondary-btn">إلغاء التسليم</button>
    </div>
  </div>

  <div class="warning-box">
    ⚠️ التبويب المُسلّم أو الذي يُنشئه الوكيل سيعرض شريط Chrome الأصفر للتصحيح. التبويبات الأخرى الخاصة بك محمية ولا يمكن للوكيل الوصول إليها.
  </div>

  <script src="popup.js"></script>
</body>
</html>
